<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Expense Tracker</h1>
      <p class="total"><span>Total spent</span><strong id="total">₹0.00</strong></p>
    </header>

    <form id="form">
      <input id="title" placeholder="What did you spend on?" maxlength="80" required>
      <input id="amount" type="number" min="0" step="0.01" placeholder="Amount in ₹" required>
      <select id="category" aria-label="Category"></select>
      <input id="date" type="date" aria-label="Date">
      <div class="actions">
        <button id="save" type="submit">Add expense</button>
        <button id="cancel" type="button" class="ghost" hidden>Cancel</button>
      </div>
    </form>

    <div class="bar">
      <h2>Expenses</h2>
      <select id="filter" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
